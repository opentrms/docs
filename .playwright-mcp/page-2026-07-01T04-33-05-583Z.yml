    - generic [ref=e443]:
      - generic [ref=e444]:
        - text: AI-native operations
        - heading "An operations control room that never sleeps — and never lies about what it did." [level=2] [ref=e445]
        - paragraph [ref=e446]: The boring half of trade ops — chasing breaks, pulling confirmations, summarising P&L moves — is exactly the work an agent should own. OpenTRMS gives your team agents that act through the same controls a human does, leave the same audit trail, and stop the moment they hit a limit.
      - generic [ref=e447]:
        - list [ref=e449]:
          - listitem [ref=e450]:
            - heading "Agents that go through your controls, not around them." [level=3] [ref=e451]
            - paragraph [ref=e452]: Every agent calls the same domain services as the REST API. Same scopes. Same approval chains. An agent cannot do anything a user with its scope couldn't do.
          - listitem [ref=e453]:
            - heading "Human-in-the-loop where it matters." [level=3] [ref=e454]
            - paragraph [ref=e455]: The agent proposes; the human approves. Material actions never auto-execute, and every proposal is recorded as an event — including the one you rejected.
          - listitem [ref=e456]:
            - heading "Plug into your AI stack, not ours." [level=3] [ref=e457]
            - paragraph [ref=e458]: "Built-in MCP server: any MCP-compatible client (Claude, internal agents, Copilot-style IDEs) talks to OpenTRMS out of the box. No bespoke connectors, no proprietary protocol."
          - listitem [ref=e459]:
            - heading "Your data stays where it is." [level=3] [ref=e460]
            - paragraph [ref=e461]: Self-hosted. Bring your own model. The agent runtime sits next to your event store — not in a vendor cloud you don't control.
