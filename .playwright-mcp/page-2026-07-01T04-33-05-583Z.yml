      - paragraph [ref=e285]: One position model. One P&L. One audit trail. No more end-of-day stitching between siloed systems.
    - generic [ref=e287]:
      - generic [ref=e288]:
        - text: The complete deal lifecycle
        - heading "Follow one trade from capture to closeout." [level=2] [ref=e289]
        - paragraph [ref=e290]: A trading platform isn't a feature list — it's the path a deal walks every day. Here is that path on OpenTRMS, told from the seat of the person who actually does the work.
      - list [ref=e291]:
        - listitem [ref=e293]:
          - generic [ref=e294]: "01"
          - generic [ref=e295]:
            - heading "Captured" [level=3] [ref=e296]
            - generic [ref=e297]: Front office
          - paragraph [ref=e298]: A trader books a 5Y USD interest-rate swap with ABC Bank. One screen, one click — or one sentence to the AI desk assistant.
        - listitem [ref=e299]:
          - generic [ref=e300]: "02"
          - generic [ref=e301]:
            - heading "Validated" [level=3] [ref=e302]
            - generic [ref=e303]: STP engine
          - paragraph [ref=e304]: Limits, counterparty, product schema and credit checks run in milliseconds. Eligible trades flow through; exceptions stop and explain themselves.
        - listitem [ref=e305]:
          - generic [ref=e306]: "03"
          - generic [ref=e307]:
            - heading "Approved" [level=3] [ref=e308]
            - generic [ref=e309]: Middle office
          - paragraph [ref=e310]: A scoped approval chain routes the trade to the right desk head. No self-approval, no shortcuts — every signature is recorded as an event.
        - listitem [ref=e311]:
          - generic [ref=e312]: "04"
          - generic [ref=e313]:
            - heading "Confirmed" [level=3] [ref=e314]
            - generic [ref=e315]: Operations
          - paragraph [ref=e316]: Confirmation flows out, the deal is locked, and the position updates on the trader's blotter and the risk desk's exposure view at the same time.
        - listitem [ref=e317]:
          - generic [ref=e318]: "05"
          - generic [ref=e319]:
            - heading "Settled" [level=3] [ref=e320]
            - generic [ref=e321]: Treasury / settlements
          - paragraph [ref=e322]: Netting collapses cashflows by counterparty and currency. Payment messages (MT103/MT202) are generated and dispatched on schedule.
        - listitem [ref=e323]:
          - generic [ref=e324]: "06"
          - generic [ref=e325]:
            - heading "Accrued & valued" [level=3] [ref=e326]
            - generic [ref=e327]: Finance / risk
          - paragraph [ref=e328]: End-of-day rebuilds curves, accrues interest, marks the book to market and posts journals — every step is an event you can replay.
        - listitem [ref=e329]:
          - generic [ref=e330]: "07"
          - generic [ref=e331]:
            - heading "Closed out" [level=3] [ref=e332]
            - generic [ref=e333]: Back office
          - paragraph [ref=e334]: At maturity or termination, rule-driven matching offsets positions and the deal walks cleanly off the book — with the full history intact.
      - paragraph [ref=e336]: "Behind every state change: a typed event, an immutable hash, an authorised user, a correlation id. Reconstructing what happened on any day, for any deal, is a query — not an investigation."
    - generic [ref=e338]:
      - generic [ref=e339]:
        - text: Audit trail as system of record
        - heading "Your audit trail isn't a report. It's the platform." [level=2] [ref=e340]
        - paragraph [ref=e341]: "Most TRMS vendors bolt audit tables onto a CRUD database and hope. OpenTRMS is event-sourced from the first commit — the history of every deal is the deal. Audit, control and risk teams get the answer they actually want: a single, attributed, replayable timeline."
      - generic [ref=e342]:
        - list [ref=e343]:
          - listitem [ref=e344]:
            - img [ref=e346]
            - generic [ref=e348]:
              - heading "Nothing is overwritten — ever." [level=3] [ref=e349]
              - paragraph [ref=e350]: Every state change appends a new event. The history of a deal is the deal. Auditors stop asking "show me the change log" because the change log is all there is.
          - listitem [ref=e351]:
            - img [ref=e353]
            - generic [ref=e355]:
              - heading "Tampering breaks the chain, visibly." [level=3] [ref=e356]
              - paragraph [ref=e357]: Every event is hashed and linked to the previous one. Insert, delete or modify any record and the chain refuses to reconcile — no quiet edits, no "lost" rows.
          - listitem [ref=e358]:
            - img [ref=e360]
            - generic [ref=e362]:
              - heading "Immutability enforced by the database, not by trust." [level=3] [ref=e363]
              - paragraph [ref=e364]: UPDATE and DELETE on the event table are revoked at the PostgreSQL level. Application bugs cannot rewrite history. Neither can a misbehaving DBA.
          - listitem [ref=e365]:
            - img [ref=e367]
            - generic [ref=e369]:
              - heading "Every action is attributed." [level=3] [ref=e370]
              - paragraph [ref=e371]: User, scope, correlation id and timestamp are part of the event. "Who approved this?" is a one-line query, not a forensics project.
          - listitem [ref=e372]:
            - img [ref=e374]
            - generic [ref=e376]:
              - heading "Replay any day, on demand." [level=3] [ref=e377]
              - paragraph [ref=e378]: Rebuild the book as it stood at any point in time. Reconcile to a regulator, run a what-if, or unblock a dispute — without freezing production.
