    - main [ref=e116]:
      - generic [ref=e118]:
        - generic [ref=e120]:
          - article [ref=e121]:
            - generic [ref=e122]:
              - heading "Positions and Portfolio KPIs" [level=1] [ref=e124]
              - generic [ref=e126]:
                - paragraph [ref=e127]: How to read aggregated positions in the OpenTRMS Workbench — grouping by currency or asset class — and the per-currency KPI summary built from them.
                - group [ref=e130]:
                  - generic "Transcript 1m 57s" [ref=e131] [cursor=pointer]:
                    - text: Transcript
                    - generic [ref=e132]: 1m 57s
                - heading [level=2] [ref=e133]:
                  - text: 1. Open the Workbench
                  - link "Direct link to 1. Open the Workbench" [ref=e134] [cursor=pointer]:
                    - /url: "#1-open-the-workbench"
                    - text: "#"
                - paragraph [ref=e135]: In this walkthrough we'll read your positions, group them, and see the portfolio summary, in the OpenTRMS Workbench.
                - paragraph [ref=e136]:
                  - img "Step 1" [ref=e137]
                - heading [level=2] [ref=e138]:
                  - text: 2. Open Portfolio Positions
                  - link "Direct link to 2. Open Portfolio Positions" [ref=e139] [cursor=pointer]:
                    - /url: "#2-open-portfolio-positions"
                    - text: "#"
                - paragraph [ref=e140]: Portfolio Positions is not a list of trades. It is what those trades add up to — one row per instrument you hold, aggregated across books.
                - paragraph [ref=e141]:
                  - img "Step 2" [ref=e142]
                - heading [level=2] [ref=e143]:
                  - text: 3. Columns are grouped into bands
                  - link "Direct link to 3. Columns are grouped into bands" [ref=e144] [cursor=pointer]:
                    - /url: "#3-columns-are-grouped-into-bands"
                    - text: "#"
                - paragraph [ref=e145]: The columns come in bands. Position covers quantity and notional, Valuation covers what it is worth, and profit and loss sits beside it, so related numbers stay together as you scroll.
                - paragraph [ref=e146]:
                  - img "Step 3" [ref=e147]
                - heading [level=2] [ref=e148]:
                  - text: 4. Filter by book and currency
                  - link "Direct link to 4. Filter by book and currency" [ref=e149] [cursor=pointer]:
                    - /url: "#4-filter-by-book-and-currency"
                    - text: "#"
                - paragraph [ref=e150]: Book and currency narrow the view. Positions are aggregated across every book you can see, so filtering to one book is how you get to a single desk's exposure.
                - paragraph [ref=e151]:
                  - img "Step 4" [ref=e152]
                - heading [level=2] [ref=e153]:
                  - text: 5. Group by currency
                  - link "Direct link to 5. Group by currency" [ref=e154] [cursor=pointer]:
                    - /url: "#5-group-by-currency"
                    - text: "#"
                - paragraph [ref=e155]: Group by changes the shape of the answer. Grouping by currency collapses the holdings into one parent row per currency, with the count beside it.
                - paragraph [ref=e156]:
                  - img "Step 5" [ref=e157]
                - heading [level=2] [ref=e158]:
                  - text: 6. Group by another dimension
                  - link "Direct link to 6. Group by another dimension" [ref=e159] [cursor=pointer]:
                    - /url: "#6-group-by-another-dimension"
                    - text: "#"
                - paragraph [ref=e160]: The same control groups by asset class, issuer, or maturity bucket instead — the last of these being how you see what is rolling off in the near term.
                - paragraph [ref=e161]:
                  - img "Step 6" [ref=e162]
                - heading [level=2] [ref=e163]:
                  - text: 7. Density and saved templates
                  - link "Direct link to 7. Density and saved templates" [ref=e164] [cursor=pointer]:
                    - /url: "#7-density-and-saved-templates"
                    - text: "#"
                - paragraph [ref=e165]: Compact tightens the rows when you want more of them on screen at once, and a view you have set up can be saved as a template to come back to.
                - paragraph [ref=e166]:
                  - img "Step 7" [ref=e167]
                - heading [level=2] [ref=e168]:
                  - text: 8. Open the KPI Summary
                  - link "Direct link to 8. Open the KPI Summary" [ref=e169] [cursor=pointer]:
                    - /url: "#8-open-the-kpi-summary"
                    - text: "#"
                - paragraph [ref=e170]: The KPI Summary answers the same question one level up. It takes the positions you just filtered and reduces them to a card per currency.
                - paragraph [ref=e171]:
                  - img "Step 8" [ref=e172]
                - heading [level=2] [ref=e173]:
                  - text: 9. Read a currency card
                  - link "Direct link to 9. Read a currency card" [ref=e174] [cursor=pointer]:
                    - /url: "#9-read-a-currency-card"
                    - text: "#"
                - paragraph [ref=e175]: Each card carries market value, the day's profit and loss, unrealized profit and loss, net notional, and how many positions and deals sit behind it.
                - paragraph [ref=e176]:
                  - img "Step 9" [ref=e177]
                - heading [level=2] [ref=e178]:
                  - text: 10. Summary and detail stay in step
                  - link "Direct link to 10. Summary and detail stay in step" [ref=e179] [cursor=pointer]:
                    - /url: "#10-summary-and-detail-stay-in-step"
                    - text: "#"
                - paragraph [ref=e180]: Because both surfaces share the same filters, the summary and the detail always describe the same set of positions. That is the pattern across the Workbench — work at the level you need, and drill down when a number looks wrong.
                - paragraph [ref=e181]:
                  - img "Step 10" [ref=e182]
                - heading [level=2] [ref=e183]:
                  - text: 11. Next steps
                  - link "Direct link to 11. Next steps" [ref=e184] [cursor=pointer]:
                    - /url: "#11-next-steps"
                    - text: "#"
                - paragraph [ref=e185]: That completes Positions and Portfolio KPIs. Every surface shown here can also be opened from the agent panel on the right, by asking for it in plain English.
            - link "Edit this page" [ref=e191] [cursor=pointer]:
              - /url: https://github.com/ichagas/OpenTRMS/tree/main/docs/learn/trading/04-positions.mdx
