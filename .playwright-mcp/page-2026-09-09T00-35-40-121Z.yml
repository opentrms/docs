    - main [ref=e116]:
      - generic [ref=e118]:
        - generic [ref=e120]:
          - article [ref=e121]:
            - generic [ref=e122]:
              - heading "Getting Started in the Workbench" [level=1] [ref=e124]
              - generic [ref=e126]:
                - paragraph [ref=e127]: A first tour of the OpenTRMS Workbench — how the workspace is laid out, how to open, arrange and close screens, and how to find anything from one keyboard shortcut.
                - generic [ref=e128]:
                  - 'button "Play video: Walkthrough" [ref=e129] [cursor=pointer]':
                    - generic [aria-hidden] [ref=e130]: ▶
                  - group [ref=e131]:
                    - generic "Transcript 2m 47s" [ref=e132] [cursor=pointer]:
                      - text: Transcript
                      - generic [ref=e133]: 2m 47s
                - heading [level=2] [ref=e134]:
                  - text: 1. The four parts of the screen
                  - link "Direct link to 1. The four parts of the screen" [ref=e135] [cursor=pointer]:
                    - /url: "#1-the-four-parts-of-the-screen"
                    - text: "#"
                - paragraph [ref=e136]: In this walkthrough we'll take a first tour of the workspace and learn how to find anything. The screen has four parts — the top bar, the navigation on the left, your workspace in the middle, and the agent on the right.
                - paragraph [ref=e137]:
                  - img "Step 1" [ref=e138]
                - heading [level=2] [ref=e139]:
                  - text: 2. The navigation on the left
                  - link "Direct link to 2. The navigation on the left" [ref=e140] [cursor=pointer]:
                    - /url: "#2-the-navigation-on-the-left"
                    - text: "#"
                - paragraph [ref=e141]: Start on the left. The navigation lists every screen, grouped by what it is for — trades, instruments, market data, risk, and post-trade operations.
                - paragraph [ref=e142]:
                  - img "Step 2" [ref=e143]
                - heading [level=2] [ref=e144]:
                  - text: 3. The agent on the right
                  - link "Direct link to 3. The agent on the right" [ref=e145] [cursor=pointer]:
                    - /url: "#3-the-agent-on-the-right"
                    - text: "#"
                - paragraph [ref=e146]: On the right is the agent — a second way into the same screens. Describe what you need in plain English and it opens them, and the prompt library below has examples.
                - paragraph [ref=e147]:
                  - img "Step 3" [ref=e148]
                - heading [level=2] [ref=e149]:
                  - text: 4. Collapse the navigation
                  - link "Direct link to 4. Collapse the navigation" [ref=e150] [cursor=pointer]:
                    - /url: "#4-collapse-the-navigation"
                    - text: "#"
                - paragraph [ref=e151]: Both sides fold away when you want the room. The navigation collapses from the button beside the Workbench name.
                - paragraph [ref=e152]:
                  - img "Step 4" [ref=e153]
                - heading [level=2] [ref=e154]:
                  - text: 5. Hide the agent
                  - link "Direct link to 5. Hide the agent" [ref=e155] [cursor=pointer]:
                    - /url: "#5-hide-the-agent"
                    - text: "#"
                - paragraph [ref=e156]: The agent hides the same way, which gives your workspace the full width of the screen.
                - paragraph [ref=e157]:
                  - img "Step 5" [ref=e158]
                - heading [level=2] [ref=e159]:
                  - text: 6. Bring the navigation back
                  - link "Direct link to 6. Bring the navigation back" [ref=e160] [cursor=pointer]:
                    - /url: "#6-bring-the-navigation-back"
                    - text: "#"
                - paragraph [ref=e161]: The same two buttons bring them back.
                - paragraph [ref=e162]:
                  - img "Step 6" [ref=e163]
                - heading [level=2] [ref=e164]:
                  - text: 7. Bring the agent back
                  - link "Direct link to 7. Bring the agent back" [ref=e165] [cursor=pointer]:
                    - /url: "#7-bring-the-agent-back"
                    - text: "#"
                - paragraph [ref=e166]: Nothing is lost while they are hidden.
                - paragraph [ref=e167]:
                  - img "Step 7" [ref=e168]
                - heading [level=2] [ref=e169]:
                  - text: 8. Open your first screen
                  - link "Direct link to 8. Open your first screen" [ref=e170] [cursor=pointer]:
                    - /url: "#8-open-your-first-screen"
                    - text: "#"
                - paragraph [ref=e171]: Now the middle. Open a screen and it appears as a panel in your workspace. Panels are tiles rather than pop-up windows.
                - paragraph [ref=e172]:
                  - img "Step 8" [ref=e173]
                - heading [level=2] [ref=e174]:
                  - text: 9. Work with more than one screen
                  - link "Direct link to 9. Work with more than one screen" [ref=e175] [cursor=pointer]:
                    - /url: "#9-work-with-more-than-one-screen"
                    - text: "#"
                - paragraph [ref=e176]: Open a second and the two tile together, one below the other. Neither hides the navigation or the agent, so you keep your place while you work.
                - paragraph [ref=e177]:
                  - img "Step 9" [ref=e178]
                - heading [level=2] [ref=e179]:
                  - text: 10. Control an individual panel
                  - link "Direct link to 10. Control an individual panel" [ref=e180] [cursor=pointer]:
                    - /url: "#10-control-an-individual-panel"
                    - text: "#"
                - paragraph [ref=e181]: Each panel has its own controls — maximise it, detach it into a separate window, or close it.
                - paragraph [ref=e182]:
                  - img "Step 10" [ref=e183]
                - heading [level=2] [ref=e184]:
                  - text: 11. Check the business date
                  - link "Direct link to 11. Check the business date" [ref=e185] [cursor=pointer]:
                    - /url: "#11-check-the-business-date"
                    - text: "#"
                - paragraph [ref=e186]: That leaves the top bar. Everything is shown as of a business date, not today's date — the first thing to check when a number looks wrong.
                - paragraph [ref=e187]:
                  - img "Step 11" [ref=e188]
                - heading [level=2] [ref=e189]:
                  - text: 12. Understand what you can see
                  - link "Direct link to 12. Understand what you can see" [ref=e190] [cursor=pointer]:
                    - /url: "#12-understand-what-you-can-see"
                    - text: "#"
                - paragraph [ref=e191]: Beside it is the role you are signed in as. It decides what appears in the navigation, so if a colleague has an item you do not, that is entitlements rather than a fault.
                - paragraph [ref=e192]:
                  - img "Step 12" [ref=e193]
                - heading [level=2] [ref=e194]:
                  - text: 13. Save a workspace for next time
                  - link "Direct link to 13. Save a workspace for next time" [ref=e195] [cursor=pointer]:
                    - /url: "#13-save-a-workspace-for-next-time"
                    - text: "#"
                - paragraph [ref=e196]: An arrangement you like can be kept. Templates hold saved layouts and presets for common operations, so a morning setup is one click.
                - paragraph [ref=e197]:
                  - img "Step 13" [ref=e198]
                - heading [level=2] [ref=e199]:
                  - text: 14. Back out with Escape
                  - link "Direct link to 14. Back out with Escape" [ref=e200] [cursor=pointer]:
                    - /url: "#14-back-out-with-escape"
                    - text: "#"
                - paragraph [ref=e201]: Escape closes any menu or dialog, and always backs you out safely.
                - heading [level=2] [ref=e202]:
                  - text: 15. Close everything at once
                  - link "Direct link to 15. Close everything at once" [ref=e203] [cursor=pointer]:
                    - /url: "#15-close-everything-at-once"
                    - text: "#"
                - paragraph [ref=e204]: And when you have finished, close every panel at once from here.
                - paragraph [ref=e205]:
                  - img "Step 15" [ref=e206]
                - heading [level=2] [ref=e207]:
                  - text: 16. Open universal search with Command K
                  - link "Direct link to 16. Open universal search with Command K" [ref=e208] [cursor=pointer]:
                    - /url: "#16-open-universal-search-with-command-k"
                    - text: "#"
                - paragraph [ref=e209]: One last thing, and the most useful. Command K, or Control K, opens universal search from anywhere.
                - paragraph [ref=e210]:
                  - img "Step 16" [ref=e211]
                - heading [level=2] [ref=e212]:
                  - text: 17. Search for a screen
                  - link "Direct link to 17. Search for a screen" [ref=e213] [cursor=pointer]:
                    - /url: "#17-search-for-a-screen"
                    - text: "#"
                - paragraph [ref=e214]: Type what you are after and matching screens come first. No need to remember which menu group it lives under.
                - paragraph [ref=e215]:
                  - img "Step 17" [ref=e216]
                - heading [level=2] [ref=e217]:
                  - text: 18. Search for an instrument
                  - link "Direct link to 18. Search for an instrument" [ref=e218] [cursor=pointer]:
                    - /url: "#18-search-for-an-instrument"
                    - text: "#"
                - paragraph [ref=e219]: It searches your data as well. An ISIN finds the instrument itself.
                - paragraph [ref=e220]:
                  - img "Step 18" [ref=e221]
                - heading [level=2] [ref=e222]:
                  - text: 19. Search for a deal
                  - link "Direct link to 19. Search for a deal" [ref=e223] [cursor=pointer]:
                    - /url: "#19-search-for-a-deal"
                    - text: "#"
                - paragraph [ref=e224]: A counterparty name finds deals booked against it. The same search covers users, parties and market indexes, and a result opens straight away.
                - paragraph [ref=e225]:
                  - img "Step 19" [ref=e226]
                - heading [level=2] [ref=e227]:
                  - text: 20. Ask the agent from the same box
                  - link "Direct link to 20. Ask the agent from the same box" [ref=e228] [cursor=pointer]:
                    - /url: "#20-ask-the-agent-from-the-same-box"
                    - text: "#"
                - paragraph [ref=e229]: And the top row hands what you typed to the agent, so the same box is both a search and a question.
                - paragraph [ref=e230]:
                  - img "Step 20" [ref=e231]
                - heading [level=2] [ref=e232]:
                  - text: 21. Next steps
                  - link "Direct link to 21. Next steps" [ref=e233] [cursor=pointer]:
                    - /url: "#21-next-steps"
                    - text: "#"
                - paragraph [ref=e234]: That completes Getting Started in the Workbench. Every surface shown here can also be opened from the agent panel on the right, by asking for it in plain English.
            - link "Edit this page" [ref=e240] [cursor=pointer]:
              - /url: https://github.com/ichagas/OpenTRMS/tree/main/docs/learn/get-started/getting-started.mdx
